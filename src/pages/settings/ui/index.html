<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>FlexTimer 설정</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="settings-container">
      <h2>FlexTimer 설정</h2>

      <div class="setting-group">
        <label>메뉴바 아이콘 (퇴근/미로그인)</label>
        <input type="text" id="customIcon" placeholder="예: ⚪" />
      </div>

      <div class="setting-group">
        <label>메뉴바 아이콘 (근무 중)</label>
        <input type="text" id="loggedInIcon" placeholder="예: 🕐" />
      </div>

      <div class="setting-group">
        <label>기본 휴게시간 (분)</label>
        <input type="number" id="breakMinutes" min="0" max="480" />
      </div>

      <div class="setting-row">
        <div class="setting-group half">
          <label>목표 근무 시간 (시간)</label>
          <input type="number" id="targetWorkHours" min="1" max="12" step="0.5" />
        </div>
        <div class="setting-group half">
          <label>초과 근무 알림 기준 (시간)</label>
          <input type="number" id="overtimeHours" min="1" max="12" step="0.5" />
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-group half">
          <label>휴게 시작</label>
          <input type="time" id="breakStartTime" />
        </div>
        <div class="setting-group half">
          <label>휴게 종료</label>
          <input type="time" id="breakEndTime" />
        </div>
      </div>

      <div class="setting-group setting-toggle">
        <label for="launchAtLogin">로그인 시 자동 실행</label>
        <input type="checkbox" id="launchAtLogin" />
      </div>

      <div class="actions">
        <button id="saveBtn" class="primary">저장</button>
        <button id="closeBtn">닫기</button>
      </div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
